name: Push Docker image to ghcr.io

on:
  workflow_dispatch:   # 允许手动触发
  repository_dispatch: # 接收外部 dispatch 触发
  schedule:
    - cron: '0 1 */7 * *'    # 每7天触发一次
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # 镜像名称必须全小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 使用官方 action 自动提取格式正确（小写）的元数据
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      # 步骤 1：构建并推送到 GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 步骤 2：构建并加载到本地 Docker daemon（用于后续 docker save）
      - name: Build and load Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Save Docker image locally
        run: docker save --output docker-smartdns.tar "${{ steps.meta.outputs.tags }}"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-smartdns
          path: docker-smartdns.tar
          retention-days: 3

      - name: Release with Notes
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: docker-smartdns.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
